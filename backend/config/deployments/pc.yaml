# 실행:
#   uv sync
#   uv run --no-sync python -m apps.main --host pc

driver_mode: real

rdb_uri: "sqlite:///horibot.db"
object_uri: "storage/blobs"

dev_console: true

zenoh:
  mode: peer
  scouting:
    multicast:
      enabled: true

modules:
  - name: camera_decoded
    robots: [so101_6dof_0, omx_f_0]
  - name: motion_preview
  - name: calibration
  - name: scene3d
  - name: scan
  - name: waypoint
  # shared_config (2026-07-22 신설) — 공유 config owner (workcell ROI SSOT:
  # instance.yaml R/W + Mirror snapshot). detector 앞 = 부팅 initial snapshot
  # 즉시 수렴 (늦어도 liveliness 로 자동 수렴 — 순서는 최적화일 뿐).
  - name: shared_config
  # plc (2026-07-31 신설) — OpenPLC Runtime v4 (:502, plc/plcs.yaml) 를 Modbus TCP
  # 마스터로 스캔. Runtime 이 안 떠 있어도 부팅은 됨 — 백그라운드 재연결 +
  # connected=False 표면화 (docs/plc_conveyor.md §9).
  - name: plc
  - name: detector
  - name: llm
  - name: pick_and_place
  # world_scan (2026-07-21 신설) — 3D 배경 메시 전용 스캔 task (pick 편승 분리).
  - name: world_scan
  # handover (2026-07-17 신설, 2026-07-24 실물 검증용 활성화) — ⚠ 아직 실물
  # 미검증 task. omx pick(open-loop)/수취/충돌 margin 전부 실물 특성화 필요.
  # 첫 런 전 modules/tasks/handover/steps.py docstring 의 가정 ①~③ 확인 +
  # omx held 임계는 scripts/gripper_characterize.py 로 재도출 (Feetech 값 무의미).
  - name: handover
  - name: bridge
  - name: logcollector
  - name: host_monitor
